name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Boundaries, not a cross product. What breaks a reusable Django app is
      # the oldest and the newest supported combination; the cells in between
      # fail for the same reasons and cost CI minutes to tell us so twice.
      matrix:
        include:
          - { python: "3.10", django: "4.2" }  # floor: oldest supported
          - { python: "3.12", django: "5.2" }  # current LTS
          - { python: "3.13", django: "6.1" }  # ceiling: newest supported
    name: py${{ matrix.python }} / django${{ matrix.django }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "django~=${{ matrix.django }}.0" nh3
          python -m pip install -e .

      - name: Test
        run: python tests/manage.py test tests --verbosity 2

  build:
    # A package that passes its tests but cannot be built is still broken.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*

      - name: Translations are compiled and shipped
        # .mo files are committed (as django-allauth does) so an editable
        # install speaks the user's language with no build step. The cost is
        # that they can drift from the .po — fail here rather than ship a
        # wheel whose translations are missing.
        run: |
          python - <<'PY'
          import sys, zipfile, glob
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          missing = [
              lang for lang in ("fr", "es", "ja")
              if f"consent_trail/locale/{lang}/LC_MESSAGES/django.mo" not in names
          ]
          if missing:
              sys.exit(f"compiled catalogue missing from the wheel: {missing}")
          print("catalogues present:", whl)
          PY
